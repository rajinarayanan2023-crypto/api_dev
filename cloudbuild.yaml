steps:
  - name: 'gcr.io/k8s-skaffold/pack'
    entrypoint: 'pack'
    args:
      - 'build'
      - '--builder=gcr.io/buildpacks/builder:v1'
      - '--env=GOOGLE_PYTHON_VERSION=3.13.*'
      - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ga-petrol-api'

images:
  - 'asia-southeast1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/ga-petrol-api'

options:
  logging: CLOUD_LOGGING_ONLY
